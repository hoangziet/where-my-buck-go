<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transactions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAF6}
a{color:#1F6B44}a:hover{color:#14502F}
</style>
</helmet>
<div style="min-height: 100vh; background: #FBFAF6; color: #16201A; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #ECEAE2; background: #FFFFFF; display: flex; flex-direction: column; gap: 28px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #16201A; padding: 0 8px">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: #1F6B44; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.6 5 3 5 1.3 5 3.3-2.2 3.2-5 3.2-5-1.2-5-3"></path></svg></span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px">Where My Buck Go</span>
    </a>
    <nav aria-label="App" style="display: flex; flex-direction: column; gap: 4px">
      <a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #4A554D; text-decoration: none; font-weight: 500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
      <a href="Chat.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #4A554D; text-decoration: none; font-weight: 500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>AI Chat</a>
      <a href="Transactions.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; background: #EEF5F0; color: #14502F; text-decoration: none; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>Transactions</a>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid #ECEAE2">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #E3EDE6; color: #14502F; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">MA</span>
      <div style="display: flex; flex-direction: column"><span style="font-weight: 500; font-size: 14px">Minh Anh</span><span style="font-size: 12px; color: #5B665E">Personal</span></div>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 32px; letter-spacing: -0.02em">Transactions</h1>
        <span style="font-size: 14px; color: #5B665E">{{countLabel}}</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <button type="button" style="font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; background: #FFFFFF; color: #16201A; border: 1px solid #E3E1D8; border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>Export CSV</button>
        <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; background: #1F6B44; color: #FFFFFF; border: 0; border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Add transaction</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
      <div style="flex: 1 1 280px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E3E1D8; border-radius: 10px; padding: 0 14px; min-height: 44px">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5B665E" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="tx-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search transactions</label>
        <input id="tx-search" type="search" placeholder="Search description, store, note…" style="font: inherit; font-size: 14px; border: 0; outline: none; background: transparent; flex: 1 1 auto; min-width: 0; color: #16201A">
      </div>
      <div role="group" aria-label="Type" style="display: flex; background: #F1EFE8; border-radius: 10px; padding: 3px">
        <sc-for list="{{types}}" as="ty" hint-placeholder-count="3">
          <button type="button" onClick="{{ty.pick}}" aria-pressed="{{ty.on}}" style="font: inherit; font-size: 13px; font-weight: {{ty.weight}}; border: 0; background: {{ty.bg}}; color: #16201A; padding: 8px 14px; border-radius: 8px; min-height: 38px; cursor: pointer">{{ty.label}}</button>
        </sc-for>
      </div>
      <button type="button" style="font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; color: #16201A; border: 1px solid #E3E1D8; border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer">All categories<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button type="button" style="font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; color: #16201A; border: 1px solid #E3E1D8; border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>1 – 11 Nov 2026</button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E6DE; border-radius: 16px; overflow-x: auto">
      <table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px">
        <thead>
          <tr style="color: #5B665E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em">
            <th scope="col" style="text-align: left; padding: 14px 20px; font-weight: 600; border-bottom: 1px solid #ECEAE2">Date</th>
            <th scope="col" style="text-align: left; padding: 14px 12px; font-weight: 600; border-bottom: 1px solid #ECEAE2">Description</th>
            <th scope="col" style="text-align: left; padding: 14px 12px; font-weight: 600; border-bottom: 1px solid #ECEAE2">Category</th>
            <th scope="col" style="text-align: left; padding: 14px 12px; font-weight: 600; border-bottom: 1px solid #ECEAE2">Source</th>
            <th scope="col" style="text-align: right; padding: 14px 12px; font-weight: 600; border-bottom: 1px solid #ECEAE2">Amount</th>
            <th scope="col" style="padding: 14px 20px; border-bottom: 1px solid #ECEAE2"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
            <tr>
              <td style="padding: 12px 20px; border-bottom: 1px solid #F1EFE9; color: #4A554D; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{r.date}}</td>
              <td style="padding: 12px; border-bottom: 1px solid #F1EFE9"><div style="display: flex; flex-direction: column"><span style="font-weight: 500">{{r.name}}</span><span style="font-size: 12px; color: #5B665E">{{r.note}}</span></div></td>
              <td style="padding: 12px; border-bottom: 1px solid #F1EFE9"><span style="display: inline-block; padding: 3px 10px; border-radius: 99px; background: #F4F2EC; font-size: 13px; color: #33403A">{{r.cat}}</span></td>
              <td style="padding: 12px; border-bottom: 1px solid #F1EFE9; font-size: 13px; color: #4A554D">{{r.src}}</td>
              <td style="padding: 12px; border-bottom: 1px solid #F1EFE9; text-align: right; font-family: 'IBM Plex Mono', monospace; font-weight: 500; white-space: nowrap; color: {{r.color}}">{{r.amt}}</td>
              <td style="padding: 8px 20px 8px 12px; border-bottom: 1px solid #F1EFE9; white-space: nowrap; text-align: right">
                <button type="button" aria-label="Edit transaction" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #4A554D; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
                <button type="button" aria-label="Delete transaction" onClick="{{r.del}}" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #4A554D; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg></button>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>

    <sc-if value="{{hasToast}}" hint-placeholder-val="{{ true }}">
      <div role="status" style="align-self: center; display: flex; align-items: center; gap: 16px; background: #16201A; color: #FFFFFF; padding: 10px 10px 10px 18px; border-radius: 12px; font-size: 14px; box-shadow: 0 12px 28px -12px rgba(22,32,26,0.45)">
        <span>{{toastText}}</span>
        <button type="button" onClick="{{undo}}" style="font: inherit; font-size: 14px; font-weight: 600; background: #FFFFFF; color: #16201A; border: 0; border-radius: 8px; padding: 8px 14px; min-height: 36px; cursor: pointer">Undo</button>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'all', deleted: ['x0'], lastDeleted: 'x0' };
  }
  renderVals() {
    const s = this.state;
    const all = [
      { id: 'x0', date: '11/11 12:15', name: 'Cơm tấm lunch', note: 'Added in chat', cat: 'Food & Drink', src: 'Chat', amt: '−50.000 ₫', inc: false },
      { id: 'x1', date: '11/11 08:05', name: 'Grab ride to work', note: 'Added in chat', cat: 'Transport', src: 'Chat', amt: '−32.000 ₫', inc: false },
      { id: 'x2', date: '11/11 07:30', name: 'Phở breakfast', note: 'Added in chat', cat: 'Food & Drink', src: 'Chat', amt: '−45.000 ₫', inc: false },
      { id: 'x3', date: '10/11 18:42', name: 'WinMart Nguyễn Trãi', note: 'Receipt · 5 items', cat: 'Food & Drink', src: 'Receipt', amt: '−386.500 ₫', inc: false },
      { id: 'x4', date: '10/11 09:10', name: 'Highlands Coffee', note: 'Added in chat', cat: 'Food & Drink', src: 'Chat', amt: '−35.000 ₫', inc: false },
      { id: 'x5', date: '09/11 20:00', name: 'EVN electricity bill', note: 'October usage', cat: 'Bills', src: 'Manual', amt: '−1.240.000 ₫', inc: false },
      { id: 'x6', date: '08/11 15:20', name: 'Uniqlo', note: 'Receipt · 2 items', cat: 'Shopping', src: 'Receipt', amt: '−798.000 ₫', inc: false },
      { id: 'x7', date: '07/11 10:00', name: 'Freelance — logo project', note: 'Bank transfer', cat: 'Income', src: 'Chat', amt: '+4.500.000 ₫', inc: true },
      { id: 'x8', date: '05/11 21:30', name: 'CGV movie night', note: '2 tickets', cat: 'Entertainment', src: 'Chat', amt: '−240.000 ₫', inc: false },
      { id: 'x9', date: '05/11 08:00', name: 'Viettel internet', note: 'Monthly plan', cat: 'Bills', src: 'Manual', amt: '−250.000 ₫', inc: false },
      { id: 'x10', date: '01/11 09:00', name: 'Rent — November', note: 'Bank transfer', cat: 'Housing', src: 'Manual', amt: '−6.000.000 ₫', inc: false },
      { id: 'x11', date: '01/11 08:00', name: 'Salary — October', note: 'Company payroll', cat: 'Income', src: 'Manual', amt: '+28.000.000 ₫', inc: true }
    ];
    const visible = all.filter((t) => !s.deleted.includes(t.id) && (s.type === 'all' || (s.type === 'income') === t.inc));
    const rows = visible.map((t) => ({ ...t, color: t.inc ? '#1F6B44' : '#16201A',
      del: () => this.setState({ deleted: [...s.deleted, t.id], lastDeleted: t.id }) }));
    const last = all.find((t) => t.id === s.lastDeleted);
    const types = [['all', 'All'], ['expense', 'Expenses'], ['income', 'Income']].map(([k, label]) => ({
      label, on: s.type === k, bg: s.type === k ? '#FFFFFF' : 'transparent', weight: s.type === k ? '600' : '400',
      pick: () => this.setState({ type: k }) }));
    return {
      rows, types,
      countLabel: visible.length + ' transactions · 1 – 11 Nov 2026',
      hasToast: !!last && s.deleted.includes(s.lastDeleted),
      toastText: last ? 'Deleted “' + last.name + '”' : '',
      undo: () => this.setState({ deleted: s.deleted.filter((d) => d !== s.lastDeleted), lastDeleted: null })
    };
  }
}
</script>
</body>
</html>
