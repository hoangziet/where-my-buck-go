    <div style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px">AI Chat</span><span style="font-size: 12px; color: #5B665E">Today's spending</span></div>
    <button type="button" aria-label="New chat" style="width: 44px; height: 44px; border: 0; background: transparent; color: #16201A; border-radius: 10px; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>

    <div style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 82%">
      <div style="width: 96px; height: 124px; border-radius: 12px; background: #EDEBE4; border: 1px solid #E3E1D8; display: flex; align-items: center; justify-content: center">
        <div role="img" aria-label="Receipt photo attachment" style="width: 60px; height: 98px; background: #FFFFFF; border-radius: 2px; box-shadow: 0 2px 6px rgba(22,32,26,0.12); padding: 8px 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; transform: rotate(-3deg)">
          <div style="height: 4px; width: 60%; background: #C9CEC9; border-radius: 2px; align-self: center"></div>
          <div style="height: 2px; background: #E3E1D8"></div><div style="height: 2px; width: 80%; background: #E3E1D8"></div><div style="height: 2px; background: #E3E1D8"></div><div style="height: 2px; width: 70%; background: #E3E1D8"></div>
          <div style="margin-top: auto; height: 4px; width: 50%; background: #8E978F; border-radius: 2px; align-self: flex-end"></div>
        </div>
      </div>
      <div style="background: #16201A; color: #FFFFFF; padding: 10px 14px; border-radius: 16px 16px 4px 16px">add this WinMart receipt</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="color: #33403A">Here's what I read. Check it, then confirm:</span>
      <div style="background: #FFFFFF; border: 1px solid #E8E6DE; border-radius: 14px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: #F6F5F0; border-bottom: 1px solid #ECEAE2; font-size: 12px; color: #4A554D">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F6B44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6"></path><path d="M9 12h6"></path></svg>Read from image · 5 items
        </div>
        <div style="padding: 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #F1EFE9">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
            <span style="font-weight: 600; font-size: 16px">WinMart Nguyễn Trãi</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">−386.500 ₫</span>

          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed #ECEAE2"><span style="color: #4A554D">Thịt ba chỉ 500g</span><span style="font-family: 'IBM Plex Mono', monospace">142.000</span></div>
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed #ECEAE2"><span style="color: #4A554D">Trứng gà (10)</span><span style="font-family: 'IBM Plex Mono', monospace">38.000</span></div>
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed #ECEAE2"><span style="color: #4A554D">Sữa tươi Vinamilk 1L</span><span style="font-family: 'IBM Plex Mono', monospace">36.500</span></div>
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px"><span style="color: #4A554D">Rau cải</span><span style="font-family: 'IBM Plex Mono', monospace">18.000</span></div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="font: inherit; font-size: 15px; font-weight: 600; background: #1F6B44; color: #FFFFFF; border: 0; border-radius: 12px; min-height: 48px; cursor: pointer">Confirm</button>
        <button type="button" style="font: inherit; font-size: 15px; font-weight: 500; background: #FFFFFF; color: #16201A; border: 1px solid #E3E1D8; border-radius: 12px; min-height: 48px; cursor: pointer">Edit fields</button>
      </div>
    </div>
  </div>

  <form style="margin: 0 12px 20px; background: #FFFFFF; border: 1px solid #E3E1D8; border-radius: 22px; padding: 6px 6px 6px 6px; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Attach image" style="width: 44px; height: 44px; border: 0; background: transparent; color: #4A554D; border-radius: 50%; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"></path></svg></button>
    <label for="m-chat-1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
    <input id="m-chat-1" type="text" placeholder="Log, snap or ask…" style="font: inherit; font-size: 15px; flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; color: #16201A">
    <button type="button" aria-label="Send" style="width: 44px; height: 44px; border: 0; background: #1F6B44; color: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg></button>
