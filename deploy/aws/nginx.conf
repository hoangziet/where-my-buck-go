worker_processes auto;
events { worker_connections 512; }
http {
    # CloudFront appends the actual viewer address after any untrusted values.
    map $http_x_forwarded_for $viewer_ip {
        default $remote_addr;
        "~(?<last_viewer>[^,\s]+)$" $last_viewer;
    }
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 4100000;
    server {
        listen 8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $viewer_ip;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 110s;
        proxy_send_timeout 110s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
        location /api/ { proxy_pass http://127.0.0.1:5000; }
        location / { proxy_pass http://127.0.0.1:3000; }
    }
}
