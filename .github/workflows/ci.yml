name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wmbg_ci
          POSTGRES_USER: wmbg_ci
          POSTGRES_PASSWORD: wmbg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wmbg_ci -d wmbg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://wmbg_ci:wmbg_ci@localhost:5432/wmbg_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest tests -q
      - run: mypy src/where_my_buck_go

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-compose:
    runs-on: ubuntu-latest
    env:
      AUTH_HMAC_KEY: ci-only-auth-key-with-at-least-thirty-two-bytes
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configurations
        run: |
          docker compose -f compose.local.yml config -q
          POSTGRES_PASSWORD=ci-pw AUTH_HMAC_KEY=ci-only-auth-key-with-at-least-thirty-two-bytes R2_ACCOUNT_ID=ci R2_ACCESS_KEY_ID=ci R2_SECRET_ACCESS_KEY=ci R2_BUCKET_NAME=ci docker compose -f compose.prod.yml config -q
      - name: Build and start the local stack
        run: docker compose -f compose.local.yml up -d --build --wait --wait-timeout 180
      - name: Verify backend and frontend routes
        run: |
          curl --fail --silent --show-error http://localhost:5000/api/health | grep -Fx '{"status":"ok"}'
          curl --fail --silent --show-error --output /dev/null http://localhost:3100/login
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        run: npm ci
        working-directory: frontend
      - name: Install browser for Docker frontend tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Exercise the production Docker frontend
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      - name: Bootstrap an isolated CI owner
        run: >-
          docker compose -f compose.local.yml exec -T backend python -c
          'from where_my_buck_go.adapters.auth_repo import PostgresAuthStore;
          from where_my_buck_go.adapters.db import engine_for;
          from where_my_buck_go.services.auth import AuthService;
          import os;
          auth = AuthService(PostgresAuthStore(engine_for(os.environ["DATABASE_URL"])), os.environ["AUTH_HMAC_KEY"].encode());
          assert auth.bootstrap("live-ci-owner", "ci-only-password-2026")'
      - name: Verify live authenticated owner journey
        run: npx playwright test e2e/live-stack.spec.ts
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
          RUN_LIVE_E2E: "1"
          E2E_OWNER_USERNAME: live-ci-owner
          E2E_OWNER_PASSWORD: ci-only-password-2026
      - name: Back up the disposable Docker stack
        run: ./scripts/backup-local.sh "$RUNNER_TEMP/wmbg-backup"
      - name: Restore database and evidence from backup
        run: |
          set -euo pipefail
          archive="$(python3 -c 'import os; from pathlib import Path; print(next(Path(os.environ["RUNNER_TEMP"], "wmbg-backup").glob("*.tar.gz")))')"
          archive_name="$(basename "$archive")"
          (cd "$(dirname "$archive")" && sha256sum -c "$archive_name.sha256")
          restore_dir="$RUNNER_TEMP/wmbg-restore"
          mkdir -m 700 "$restore_dir"
          tar -xzf "$archive" -C "$restore_dir"
          docker compose -f compose.local.yml stop frontend backend
          docker compose -f compose.local.yml exec -T db dropdb --if-exists -U fingpt fingpt
          docker compose -f compose.local.yml exec -T db createdb -U fingpt -O fingpt fingpt
          db_container="$(docker compose -f compose.local.yml ps -q db)"
          docker cp "$restore_dir/database.dump" "$db_container:/tmp/wmbg-restore.dump"
          docker compose -f compose.local.yml exec -T -u 0 db pg_restore --exit-on-error --no-owner -U fingpt -d fingpt /tmp/wmbg-restore.dump
          docker compose -f compose.local.yml exec -T -u 0 db unlink /tmp/wmbg-restore.dump
          backend_container="$(docker compose -f compose.local.yml ps -aq backend)"
          docker cp "$restore_dir/evidence/." "$backend_container:/data/evidence/"
          docker compose -f compose.local.yml up -d --wait --wait-timeout 120 frontend
      - name: Verify restored evidence against database digests
        run: |
          docker compose -f compose.local.yml exec -T backend python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          from where_my_buck_go.adapters.db import database_url_from_environment

          engine = create_engine(database_url_from_environment())
          try:
              with engine.connect() as connection:
                  rows = connection.execute(
                      text("SELECT storage_key, sha256_digest FROM evidence")
                  ).mappings().all()
              if not rows:
                  raise RuntimeError("Restored database has no evidence rows")
              for row in rows:
                  path = Path("/data/evidence") / row["storage_key"]
                  if not path.is_file():
                      raise RuntimeError(f"Missing restored evidence file: {row['storage_key']}")
                  digest = hashlib.sha256(path.read_bytes()).digest()
                  if digest != bytes(row["sha256_digest"]):
                      raise RuntimeError(f"Evidence checksum mismatch: {row['storage_key']}")
              print(f"Verified {len(rows)} restored evidence files")
          finally:
              engine.dispose()
          PY
      - name: Recheck authenticated owner journey after restore
        run: npx playwright test e2e/live-stack.spec.ts
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
          RUN_LIVE_E2E: "1"
          E2E_OWNER_USERNAME: live-ci-owner
          E2E_OWNER_PASSWORD: ci-only-password-2026
      - name: Smoke test the production Compose profile
        env:
          POSTGRES_PASSWORD: ci/prod@smoke:pass%
          AUTH_HMAC_KEY: ci-only-auth-key-with-at-least-thirty-two-bytes
          R2_ACCOUNT_ID: ci-smoke
          R2_ACCESS_KEY_ID: ci-smoke
          R2_SECRET_ACCESS_KEY: ci-smoke
          R2_BUCKET_NAME: ci-smoke
        run: |
          set -euo pipefail
          docker compose -p wmbg-production-smoke -f compose.prod.yml up -d --build --wait --wait-timeout 180
          docker compose -p wmbg-production-smoke -f compose.prod.yml exec -T backend python -c 'import shutil; assert shutil.which("wmbg-export-r2-evidence"); assert shutil.which("wmbg-restore-r2-evidence")'
          docker compose -p wmbg-production-smoke -f compose.prod.yml exec -T backend python -c 'from where_my_buck_go.adapters.auth_repo import PostgresAuthStore; from where_my_buck_go.adapters.db import database_url_from_environment, engine_for; from where_my_buck_go.services.auth import AuthService; import os; assert AuthService(PostgresAuthStore(engine_for(database_url_from_environment())), os.environ["AUTH_HMAC_KEY"].encode()).bootstrap("smoke-owner", "prod-smoke-password-123")'
          python3 - <<'PY'
          import json
          import urllib.request

          health = urllib.request.urlopen("http://127.0.0.1:3000/api/health", timeout=5)
          assert json.loads(health.read()) == {"status": "ok"}
          assert health.headers.get("Strict-Transport-Security") == "max-age=63072000; includeSubDomains"
          login = urllib.request.Request(
              "http://127.0.0.1:3000/api/auth/login",
              data=json.dumps({"username": "smoke-owner", "password": "prod-smoke-password-123"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          response = urllib.request.urlopen(login, timeout=5)
          assert response.status == 200
          cookies = response.headers.get_all("Set-Cookie") or []
          session_cookie = next(cookie for cookie in cookies if cookie.startswith("__Host-wmbg_session="))
          csrf_cookie = next(cookie for cookie in cookies if cookie.startswith("__Host-wmbg_csrf="))
          assert "Secure" in session_cookie and "HttpOnly" in session_cookie and "SameSite=Strict" in session_cookie
          assert "Secure" in csrf_cookie and "SameSite=Strict" in csrf_cookie and "HttpOnly" not in csrf_cookie
          print("Production health, HSTS, and authentication cookie checks passed")
          PY
          backend_container="$(docker compose -p wmbg-production-smoke -f compose.prod.yml ps -q backend)"
          backend_ports="$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$backend_container")"
          BACKEND_PORTS="$backend_ports" python3 -c 'import json, os; assert json.loads(os.environ["BACKEND_PORTS"])["5000/tcp"] is None'
          frontend_container="$(docker compose -p wmbg-production-smoke -f compose.prod.yml ps -q frontend)"
          test "$(docker port "$frontend_container" 3000/tcp)" = "127.0.0.1:3000"
      - name: Remove the production smoke-test stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci/prod@smoke:pass%
          AUTH_HMAC_KEY: ci-only-auth-key-with-at-least-thirty-two-bytes
          R2_ACCOUNT_ID: ci-smoke
          R2_ACCESS_KEY_ID: ci-smoke
          R2_SECRET_ACCESS_KEY: ci-smoke
          R2_BUCKET_NAME: ci-smoke
        run: docker compose -p wmbg-production-smoke -f compose.prod.yml down -v --remove-orphans
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.local.yml down
