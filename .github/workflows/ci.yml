name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wmbg_ci
          POSTGRES_USER: wmbg_ci
          POSTGRES_PASSWORD: wmbg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wmbg_ci -d wmbg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://wmbg_ci:wmbg_ci@localhost:5432/wmbg_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest tests -q
      - run: mypy src/where_my_buck_go

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-compose:
    runs-on: ubuntu-latest
    env:
      AUTH_HMAC_KEY: ci-only-auth-key-with-at-least-thirty-two-bytes
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose -f compose.local.yml config -q
      - name: Build and start the local stack
        run: docker compose -f compose.local.yml up -d --build --wait --wait-timeout 180
      - name: Verify backend and frontend routes
        run: |
          curl --fail --silent --show-error http://localhost:5000/api/health | grep -Fx '{"status":"ok"}'
          curl --fail --silent --show-error --output /dev/null http://localhost:3100/login
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        run: npm ci
        working-directory: frontend
      - name: Install browser for Docker frontend tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Exercise the production Docker frontend
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.local.yml down
