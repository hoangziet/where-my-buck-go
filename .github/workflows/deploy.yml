name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    name: Deploy Release to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Initialize Terraform backend
        working-directory: infra/aws
        run: terraform init -backend-config=backend.hcl

      - name: Sync Google OAuth credentials to AWS SSM Parameter Store
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            python3 - <<'PY'
          import json, os, subprocess
          client_id = os.environ.get("GOOGLE_CLIENT_ID")
          client_secret = os.environ.get("GOOGLE_CLIENT_SECRET")
          if client_id and client_secret:
              try:
                  current_raw = subprocess.check_output(
                      ["aws", "ssm", "get-parameter", "--name", "/wmbg/app", "--with-decryption", "--output", "json"]
                  )
                  current_data = json.loads(json.loads(current_raw)["Parameter"]["Value"])
                  current_data["GOOGLE_CLIENT_ID"] = client_id
                  current_data["GOOGLE_CLIENT_SECRET"] = client_secret
                  subprocess.run(
                      ["aws", "ssm", "put-parameter", "--name", "/wmbg/app", "--type", "SecureString",
                       "--value", json.dumps(current_data), "--overwrite"],
                      check=True
                  )
                  print("Successfully synced GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET to /wmbg/app Parameter Store.")
              except Exception as e:
                  print(f"Warning: could not sync SSM parameter: {e}")
          PY
          fi

      - name: Deploy release to AWS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/aws/manage.py deploy
