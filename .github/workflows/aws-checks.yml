name: AWS infrastructure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  aws-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/aws validate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install ruff boto3 pytest
      - run: ruff check scripts/aws deploy/aws --select F,E9
      - run: python -m pytest tests/test_aws_automation.py -q
      - name: Validate external-database Compose profile
        run: |
          mkdir -p /tmp/wmbg-ci
          touch /tmp/wmbg-ci/app.env /tmp/wmbg-ci/migration.env
          AWS_REGION=ap-southeast-2 BACKEND_IMAGE=example/backend@sha256:$(printf 'a%.0s' {1..64}) \
          FRONTEND_IMAGE=example/frontend@sha256:$(printf 'b%.0s' {1..64}) \
          PROXY_IMAGE=example/proxy@sha256:$(printf 'd%.0s' {1..64}) \
          TOOLS_IMAGE=example/tools@sha256:$(printf 'c%.0s' {1..64}) \
          AWS_APP_ENV_FILE=/tmp/wmbg-ci/app.env \
          AWS_MIGRATION_ENV_FILE=/tmp/wmbg-ci/migration.env \
          docker compose -f compose.aws.yml --profile maintenance config -q
      - name: Validate proxy configuration
        run: |
          docker build -f deploy/aws/Dockerfile.proxy -t wmbg-aws-proxy .
          docker run --rm -v "$PWD/deploy/aws/nginx.conf:/etc/nginx/nginx.conf:ro" wmbg-aws-proxy nginx -t
